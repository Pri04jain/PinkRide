name: pinkride
description: Safe. Verified. Shared. — A women-focused ride-sharing app for Jaipur.
publish_to: 'none' # This is a private app, not published to pub.dev

# ──────────────────────────────────────────────────────────────────────────────
# VERSION
# format: major.minor.patch+buildNumber
# The part before + is shown to users (e.g. "1.0.0")
# The part after + is used by app stores internally (must increase every upload)
# ──────────────────────────────────────────────────────────────────────────────
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Dart SDK version constraint

# ──────────────────────────────────────────────────────────────────────────────
# DEPENDENCIES
# These are packages your app needs to RUN.
# Think of these like npm's "dependencies" (not devDependencies).
# ──────────────────────────────────────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter # Always required — the Flutter framework itself

  # ── Networking ──────────────────────────────────────────────────────────────
  # dio: HTTP client for making API calls to the backend.
  # Why dio over http? dio has interceptors (we need this to auto-attach
  # the JWT token to every request and auto-refresh it on 401 errors).
  # http package can't do this cleanly.
  dio: ^5.4.3+1

  # ── Secure Storage ──────────────────────────────────────────────────────────
  # flutter_secure_storage: stores JWT tokens in the device's secure keychain.
  # Why not SharedPreferences? SharedPreferences stores data in plain text —
  # anyone who roots/jailbreaks the device can read it. Tokens must be secret.
  # On iOS: uses Keychain. On Android: uses EncryptedSharedPreferences.
  flutter_secure_storage: ^9.2.2

  # ── Navigation / Routing ────────────────────────────────────────────────────
  # go_router: declarative URL-based navigation (like React Router for Flutter).
  # Why not Navigator directly? go_router lets us define auth-gated routes
  # cleanly (e.g. "if not logged in, redirect to /auth/phone") and supports
  # deep links out of the box.
  go_router: ^14.3.0

  # ── State Management ────────────────────────────────────────────────────────
  # flutter_riverpod: manages app state (user session, ride status, etc.)
  # Why Riverpod over setState? When data needs to be shared across many
  # screens (e.g. the current user's profile, active ride), setState only
  # works inside one widget. Riverpod makes state global and reactive.
  # Why Riverpod over Provider? Riverpod fixes Provider's compile-time
  # safety issues and works without BuildContext — cleaner code.
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Real-time (Socket.io) ───────────────────────────────────────────────────
  # socket_io_client: connects to our Socket.io server for live driver
  # location updates, deviation alerts, and SOS events.
  # Why not just polling the REST API? Polling for location every second
  # wastes battery and bandwidth. Socket.io pushes updates the moment they
  # happen — essential for real-time tracking.
  socket_io_client: ^2.0.3+1

  # ── Maps ────────────────────────────────────────────────────────────────────
  # google_maps_flutter: renders Google Maps with markers, polylines, camera.
  # Used on the passenger home screen and the active ride tracking screen.
  # Requires a Google Maps API key (same one we configured in the backend).
  google_maps_flutter: ^2.9.0

  # ── Camera ──────────────────────────────────────────────────────────────────
  # camera: accesses the device camera for face verification selfies.
  # Used in the face registration and pre-ride verification screens.
  camera: ^0.11.0+2

  # ── Image Picker ────────────────────────────────────────────────────────────
  # image_picker: lets users pick photos from gallery OR take a new photo.
  # Used in driver document upload (license, RC, insurance photos).
  # Different from camera package — image_picker shows the OS photo picker UI.
  image_picker: ^1.1.2

  # ── Payments ────────────────────────────────────────────────────────────────
  # razorpay_flutter: official Razorpay SDK for Flutter.
  # Opens the Razorpay UPI checkout sheet natively (PhonePe, GPay, Paytm, etc.)
  # Works via callbacks (not futures) — Razorpay notifies us when payment
  # succeeds, fails, or is cancelled through event handlers.
  razorpay_flutter: ^1.3.6

  # ── Environment Variables ───────────────────────────────────────────────────
  # flutter_dotenv: loads a .env file at app startup.
  # Why? We don't want to hardcode the backend URL or API keys in Dart files.
  # In production the URL is different from dev — .env lets us switch easily.
  flutter_dotenv: ^5.2.1

  # ── Local Storage (non-sensitive) ───────────────────────────────────────────
  # shared_preferences: simple key-value storage for non-sensitive data.
  # We use this for user preferences (e.g. "has seen onboarding", theme choice).
  # DO NOT store tokens here — use flutter_secure_storage for those.
  shared_preferences: ^2.3.2

  # ── Utilities ───────────────────────────────────────────────────────────────
  # intl: internationalisation + date/number formatting.
  # We need this to format dates (ride scheduled_at) and currency (₹88.20).
  intl: ^0.19.0

  # freezed_annotation + json_annotation: together they let us define data
  # models (User, Ride, Driver) with auto-generated fromJson/toJson and
  # copyWith methods. Eliminates 90% of boilerplate model code.
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # permission_handler: manages runtime permissions (camera, location).
  # On Android and iOS we must request permissions before accessing camera
  # or GPS. This package provides a clean cross-platform API for that.
  permission_handler: ^11.3.1

  # geolocator: gets the device's GPS coordinates.
  # Used for the passenger's pickup location and driver's live location updates.
  geolocator: ^13.0.1

  # ── UI Helpers ──────────────────────────────────────────────────────────────
  # cached_network_image: loads and caches images from URLs (driver photos,
  # profile pictures). Without caching, images reload on every screen visit.
  cached_network_image: ^3.4.1

  # flutter_svg: renders SVG icons. Our brand assets are SVG for crisp display
  # at all screen sizes.
  flutter_svg: ^2.0.10+1

  # pinput: beautiful OTP input field widget (6 boxes for the 6-digit OTP).
  # Writing this from scratch takes hours — pinput is the standard choice.
  pinput: ^5.0.0

  # shimmer: shows a loading skeleton (grey animated placeholder) while data
  # loads. Much better UX than a spinner on list screens.
  shimmer: ^3.0.0

  # url_launcher: opens URLs in the browser or makes phone calls.
  # Used for "call emergency contact" and "open in Google Maps" buttons.
  url_launcher: ^6.3.1

# ──────────────────────────────────────────────────────────────────────────────
# DEV DEPENDENCIES
# These packages are ONLY used during development / code generation.
# They are NOT included in the final app build (like npm's devDependencies).
# ──────────────────────────────────────────────────────────────────────────────
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0 # Enforces Dart style guide (like ESLint for Dart)

  # build_runner: code generation tool. Runs the generators for freezed and
  # riverpod. You run it once: `dart run build_runner build`
  # It reads annotations in your code and generates the boilerplate .g.dart files.
  build_runner: ^2.4.13

  # freezed: generates immutable data classes (fromJson, toJson, copyWith,
  # equality). Run via build_runner.
  freezed: ^2.5.7

  # json_serializable: generates fromJson/toJson methods for data models.
  # Works together with freezed.
  json_serializable: ^6.8.0

  # riverpod_generator: generates Provider boilerplate from annotations.
  # Instead of writing boilerplate StateNotifierProvider code, you just
  # annotate a class with @riverpod and the generator writes the rest.
  riverpod_generator: ^2.4.3

  # custom_lint + riverpod_lint: adds Riverpod-specific lint rules in VS Code.
  # Warns you if you're using Riverpod incorrectly.
  custom_lint: ^0.6.7
  riverpod_lint: ^2.3.13

# ──────────────────────────────────────────────────────────────────────────────
# FLUTTER SECTION
# Configures assets, fonts, and Flutter-specific settings.
# ──────────────────────────────────────────────────────────────────────────────
flutter:
  uses-material-design: true # Required to use Material icons and widgets

  # Assets — files bundled into the app at build time.
  # The .env file must be here so flutter_dotenv can find it.
  # Paths are relative to the mobile/ directory.
  assets:
    - .env                    # Environment variables (backend URL, API keys)
    - assets/images/          # PNG/JPG images (logo, onboarding illustrations)
    - assets/icons/           # SVG icons
